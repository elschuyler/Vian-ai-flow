<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#14263A" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Vian personal coach lite</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: #EDEAE4;
      color: #111827;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }
    #root { min-height: 100vh; }
    button { font-family: inherit; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #C4B5FD; border-radius: 4px; }
    @keyframes spin    { to { transform: rotate(360deg); } }
    @keyframes fadeIn  { from { opacity:0; transform:translateY(8px);  } to { opacity:1; transform:translateY(0); } }
    @keyframes slideUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
    .fade-in  { animation: fadeIn  0.22s ease both; }
    .slide-up { animation: slideUp 0.28s ease both; }
    .stagger-1 { animation-delay: 0.05s; }
    .stagger-2 { animation-delay: 0.10s; }
    .stagger-3 { animation-delay: 0.15s; }
  </style>

  <!-- Back button: PWA uses popstate, APK uses Capacitor App plugin -->
  <script>
    window._studyBackHandler = null;
    window._studyCanGoBack = function(){ return false; };

    // PWA / browser
    history.replaceState({ sc: 0 }, '');
    history.pushState({ sc: 1 }, '');
    window.addEventListener('popstate', function () {
      history.pushState({ sc: 1 }, '');
      if (typeof window._studyBackHandler === 'function') {
        window._studyBackHandler();
      }
    });

    // APK: Capacitor back button — registered after page loads
    window.addEventListener('load', function () {
      try {
        if (
          window.Capacitor &&
          typeof window.Capacitor.isNativePlatform === 'function' &&
          window.Capacitor.isNativePlatform() &&
          window.Capacitor.Plugins &&
          window.Capacitor.Plugins.App
        ) {
          window.Capacitor.Plugins.App.addListener('backButton', function () {
            // _studyCanGoBack is set by app.js — true when not on home screen
            if (window._studyCanGoBack && window._studyCanGoBack()) {
              if (typeof window._studyBackHandler === 'function') {
                window._studyBackHandler();
              }
            } else {
              // At home screen — exit the app
              window.Capacitor.Plugins.App.exitApp();
            }
          });
        }
      } catch (e) {
        console.warn('Capacitor back button setup failed:', e);
      }
    });
  </script>

  <!-- IndexedDB helper -->
  <script>
    (function () {
      var _db = null;
      function open() {
        return new Promise(function (res, rej) {
          if (_db) return res(_db);
          var req = indexedDB.open('StudyCoachDB', 1);
          req.onupgradeneeded = function (e) {
            var db = e.target.result;
            if (!db.objectStoreNames.contains('subjects'))
              db.createObjectStore('subjects', { keyPath: 'subject_id' });
            if (!db.objectStoreNames.contains('progress'))
              db.createObjectStore('progress',  { keyPath: 'id' });
          };
          req.onsuccess = function (e) { _db = e.target.result; res(_db); };
          req.onerror   = function ()  { rej(req.error); };
        });
      }
      function tx(store, mode, fn) {
        return open().then(function (db) {
          return new Promise(function (res, rej) {
            var r = fn(db.transaction(store, mode).objectStore(store));
            r.onsuccess = function () { res(r.result !== undefined ? r.result : null); };
            r.onerror   = function () { rej(r.error); };
          });
        });
      }
      window.StudyDB = {
        get: function (s, k) { return tx(s, 'readonly',  function (st) { return st.get(k);   }); },
        put: function (s, v) { return tx(s, 'readwrite', function (st) { return st.put(v);   }); },
        del: function (s, k) { return tx(s, 'readwrite', function (st) { return st.delete(k);}); },
        all: function (s)    { return tx(s, 'readonly',  function (st) { return st.getAll(); }); }
      };
    })();
  </script>

  <style>
    #sc-offline-bar {
      display: none; position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
      background: #B45309; color: #fff; font-size: 12px; font-weight: 700;
      text-align: center; padding: 5px 8px; letter-spacing: 0.5px;
    }
    #sc-update-bar {
      display: none; position: fixed; bottom: 60px; left: 10px; right: 10px; z-index: 9999;
      background: #14263A; color: #fff; font-size: 13px; font-weight: 600;
      text-align: center; padding: 10px 14px; border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.35); cursor: pointer;
    }
  </style>
  <div id="sc-offline-bar">📵 Offline — cached content available</div>
  <div id="sc-update-bar" onclick="window._scApplyUpdate && window._scApplyUpdate()">🔄 App updated — tap to refresh</div>
  <script>
    function setOffline(off){ document.getElementById('sc-offline-bar').style.display=off?'block':'none'; }
    window.addEventListener('online',  function(){ setOffline(false); });
    window.addEventListener('offline', function(){ setOffline(true);  });
    if(!navigator.onLine) setOffline(true);
    if('serviceWorker' in navigator){
      window.addEventListener('load', function(){
        navigator.serviceWorker.register('sw.js').then(function(reg){
          function checkWaiting(reg){
            if(reg.waiting){
              document.getElementById('sc-update-bar').style.display='block';
              window._scApplyUpdate=function(){ reg.waiting.postMessage('SKIP_WAITING'); };
            }
          }
          checkWaiting(reg);
          reg.addEventListener('updatefound', function(){
            var n=reg.installing;
            n.addEventListener('statechange', function(){
              if(n.state==='installed'&&navigator.serviceWorker.controller) checkWaiting(reg);
            });
          });
          var refreshed=false;
          navigator.serviceWorker.addEventListener('controllerchange', function(){
            if(!refreshed){ refreshed=true; window.location.reload(); }
          });
        }).catch(function(e){ console.warn('SW failed',e); });
      });
    }
  </script>

  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
  <script src="vendor/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="app.js" data-presets="react"></script>
</body>
</html>
